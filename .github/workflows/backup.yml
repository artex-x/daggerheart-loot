name: backup

# Nightly backup of production: the schema and the `auth` and `public` data,
# each file encrypted to the owner's `age` public key before it leaves this
# job. Nothing unencrypted is uploaded - a public repository's artifacts are
# readable by anyone. The job fails closed: no recipient, a failed dump or no
# file to upload each turn it red. Sunday's run, or a dispatch with
# `art: true`, also copies the public picture bucket as art.tar.age.
# Restore procedure: .claude/README.md, "Backups and restore".

on:
  # 03:17 UTC. GitHub disables this after 60 days without a push; any push
  # re-arms it. The keep-alive is usage.yml's Data API call
  # (docs/DECISIONS.md, 2026-09-25).
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      art:
        description: Copy the pictures on this run too (every Sunday run copies them)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: backup
  cancel-in-progress: false

jobs:
  dump:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # `SUPABASE_DB_URL_PROD` lives in this Environment, which only `main` may
    # use (docs/DECISIONS.md, 2026-09-25, "The production connection string
    # lives in an Environment limited to `main`").
    environment: production
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      # The pinned Supabase CLI; the dump drives no browser.
      - run: npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'

      - name: The recipient is set - the job fails closed without it
        run: |
          case "$RECIPIENT" in
            age1*) echo "recipient: set" ;;
            *) echo "::error::BACKUP_AGE_RECIPIENT is not an age public key"; exit 1 ;;
          esac
        env:
          RECIPIENT: ${{ vars.BACKUP_AGE_RECIPIENT }}

      - name: Install age
        run: sudo apt-get update -qq && sudo apt-get install -y -qq age && age --version

      # Without `--schema`, `db dump --data-only` leaves out `auth`; the
      # schema dump leaves out roles (those need `--role-only`). Each plain
      # file is removed as soon as its encrypted copy exists.
      - name: Dump and encrypt
        id: dump
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/backup"
          mkdir -p "$out"
          cli=node_modules/supabase/dist/supabase.js
          node "$cli" db dump --db-url "$SUPABASE_DB_URL" -f "$out/schema.sql"
          node "$cli" db dump --db-url "$SUPABASE_DB_URL" --data-only --schema auth,public \
            -f "$out/data.sql"
          for f in schema data; do
            age -r "$RECIPIENT" -o "$out/$f.sql.age" "$out/$f.sql"
            rm "$out/$f.sql"
          done
          ls -l "$out"
          echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL_PROD }}
          RECIPIENT: ${{ vars.BACKUP_AGE_RECIPIENT }}

      # The weekly picture copy: the bucket is public, so the script lists the
      # names over the connection string and downloads the public addresses,
      # 8 at a time. The plain files go once the encrypted tar exists.
      - name: Copy and encrypt the pictures
        run: |
          set -euo pipefail
          if [ "$(date -u +%u)" != 7 ] && [ "$ART" != true ]; then
            echo "pictures: not tonight (Sunday's run, or a dispatch with art: true)"
            exit 0
          fi
          out="$RUNNER_TEMP/backup"
          node tools/supabase/backup-art.mjs "$out/art"
          tar -cf "$out/art.tar" -C "$out" art
          rm -rf "$out/art"
          # A temporary name: a failed `age` leaves no partial art.tar.age to upload.
          age -r "$RECIPIENT" -o "$out/art.tar.part" "$out/art.tar"
          mv "$out/art.tar.part" "$out/art.tar.age"
          rm "$out/art.tar"
          ls -l "$out"
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL_PROD }}
          RECIPIENT: ${{ vars.BACKUP_AGE_RECIPIENT }}
          ART: ${{ inputs.art }}

      # The night's dump uploads even when the picture step failed; the job
      # stays red through that step.
      - uses: actions/upload-artifact@v5
        if: ${{ !cancelled() && steps.dump.outcome == 'success' }}
        with:
          name: backup-${{ steps.dump.outputs.date }}
          path: ${{ runner.temp }}/backup/*.age
          retention-days: 30
          if-no-files-found: error
