name: check

# While the move is under way (issue #47) there is no deploy here: the live site
# is the repository root, and that is still what GitHub Pages serves. A deploy
# job arrives in phase 6, when the built app becomes what people are shown.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # gitleaks reads history, not just a snapshot

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: The same gate a person has to pass locally
        run: npm run check

      - name: Build
        run: npm run build

      - name: The built page opens from a folder
        run: node tools/smoke-file-url.mjs

      - name: Bundle size budget
        run: npm run budget

      - name: The legacy suites against the live app
        run: npm run test:legacy

      - name: Artifacts from a failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-output
          path: |
            dist/
            coverage/
          retention-days: 7

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Vulnerabilities we will not wave through
        run: npm audit --audit-level=high

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
