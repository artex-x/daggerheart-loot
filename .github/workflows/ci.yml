name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      skip_e2e:
        description: 'Skip the hosted E2E (the test project is down); on main this still deploys'
        type: boolean
        default: false

permissions:
  contents: read

# Only one publish at a time, and never cancel one half-done - but that rule
# is for the runs on main, which are the ones that can deploy: a push, and
# the owner's `skip_e2e` dispatch (`deploy`, below). A PR run shares this
# workflow and used to share this same group too, which meant two PRs (or a
# PR and a push) queued behind each other for no reason; worse, if the fix
# were "let a PR run join the `pages` group with cancel-in-progress: true",
# an in-flight publish could be cancelled mid-deploy by an unrelated PR push.
# So every run on main keeps the shared, never-cancelled `pages` group; any
# other run (PR, a dispatch or a push on another branch) gets its own group
# keyed on the ref and may cancel its own superseded runs.
concurrency:
  group: ${{ github.ref == 'refs/heads/main' && 'pages' || format('ci-{0}', github.ref) }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    runs-on: ubuntu-latest
    # No step here waits on the network long enough to need more than this,
    # but a value still has to be here: with none, a stuck step runs to
    # GitHub's own 6-hour job ceiling, and because `concurrency.group: pages`
    # is `cancel-in-progress: false`, the documented revert-and-push recovery
    # then queues behind that hung job instead of running.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: The same gate a person has to pass locally
        run: npm run check

      # `npm run check` (above) already ran `npm run data`, which regenerates
      # data.json/catalog.csv from data.js in this checkout - so
      # `tests/derived.js`, running inside that same `npm run check`, was
      # comparing the freshly regenerated files against themselves and could
      # never catch a data.js edit committed without its generated output.
      # This is the actual gate: a diff here means someone edited data.js and
      # forgot `node tools/build.js` before committing. README.md,
      # README.ru.md and .claude/hooks/edit-followup.mjs describe this step
      # too.
      - name: Generated data actually matches what is committed
        run: git diff --exit-code -- data.json catalog.csv

      - name: Build
        run: npm run build

      - name: The built page opens over HTTP
        run: node tools/smoke-http.mjs

      - name: Bundle size budget
        run: npm run budget

      # The test build is what `browser` drives (docs/specs/COVERAGE.md,
      # "Test layers"); built here too so the guard can compare both bundles.
      - name: Test build
        run: npm run build:test

      - name: The production bundle carries no fake cloud
        run: node tools/no-fake-in-prod.mjs

      # A CI run is gone by the time anyone looks at it, and the summary prints
      # a dozen grepped lines. This job no longer runs run-all.js itself (see
      # `browser`, below), so `coverage/` is what a failed `npm run check`
      # leaves; `dist/` and `dist-test/` are what a failed build, smoke,
      # budget or marker step - all run after it in this same job - leave
      # instead.
      - name: Everything a failed run left behind
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: failure-output
          path: |
            dist/
            dist-test/
            coverage/
          retention-days: 14
          if-no-files-found: ignore

  # The built app's real-Chrome suites - page sweeps, structural goldens,
  # contracts, print, everything tests/run-all.js knows about - spread over
  # four runners by CI-measured weight instead of one `check`-job step owning
  # 84% of that job plus a separate `golden` matrix that then sat idle for
  # 9m21s waiting on it. `--shard=n/4` packs the whole pool, goldens
  # included; four jobs because a CI job's fixed cost is ~20 s, not minutes,
  # and `tests/derived.js` asserts the shard count matches. See
  # tests/run-all.js's own weight comment.
  browser:
    runs-on: ubuntu-latest
    # See `check`'s own comment above - same reasoning, same fix.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # The test build: tests/app/ drive dist-test/, whose cloud is the fake
      # one (docs/specs/COVERAGE.md, "Test layers").
      - name: Build
        run: npm run build:test

      - name: The built app's suites - shard ${{ matrix.shard }} of 4
        run: node tests/run-all.js --shard=${{ matrix.shard }}/4

      - name: Everything a failed shard left behind
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: failure-output-browser-${{ matrix.shard }}
          path: |
            test-output/
            dist-test/
          retention-days: 14
          if-no-files-found: ignore

  # The database layer: RLS, functions and the migration reversibility gate,
  # against a local Supabase stack in Docker (preinstalled on ubuntu
  # runners). No hosted credential is used.
  db:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      # The database layer drives no browser.
      - run: npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'

      - name: 'The database layer: RLS, functions, migration reversals'
        run: npm run check:db

  # Layer 4: the real Supabase adapter and the account flows on the hosted
  # test project (docs/specs/COVERAGE.md, "Test layers"). One run at a time
  # across every branch - the runs share the test project's member and its
  # throwaway users. A fork's pull request has no secrets, so it skips this
  # job rather than failing it. Nothing is uploaded, on failure either: the
  # page draws the member's email and a public repository's artifacts are
  # readable by anyone. `migrate-test` applies the branch's migrations to the
  # test project first, with the connection-string secret
  # (`SUPABASE_DB_URL_TEST`, a repository secret: branch runs need it); the
  # database is the record.
  e2e:
    if: ${{ !inputs.skip_e2e && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: e2e-test-project
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Not `supabase db push`: it refuses a history that holds another
      # branch's migration, which every branch's `e2e` puts here. This
      # applies the missing files one transaction each and lists the others
      # (docs/DECISIONS.md, 2026-09-25, "CI applies the test project's
      # migrations file by file and ignores other branches' versions"). The
      # connection string stays in the step's `env:`, never in a `run:` line;
      # a network error is the secret's shape: the session pooler, port 5432
      # (.claude/README.md, "The hosted E2E and the deploy").
      - name: 'migrate-test: apply pending migrations to the test project'
        run: node tools/supabase/migrate-test.mjs
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL_TEST }}

      - name: 'The hosted E2E: the real adapter and the account flows'
        run: npm run e2e
        env:
          E2E_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
          E2E_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.E2E_SUPABASE_PUBLISHABLE_KEY }}
          E2E_SUPABASE_SECRET_KEY: ${{ secrets.E2E_SUPABASE_SECRET_KEY }}
          E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}

      # `npm run e2e` leaves the configured build in dist/: the shipped
      # bundle is measured here, before a merge, not only in `deploy`.
      - name: Bundle size budget (the configured build e2e left in dist/)
        run: npm run budget

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Vulnerabilities we will not wave through
        run: npm audit --audit-level=high
      # The two tool packages keep their own lockfiles; `npm audit` reads a
      # lockfile alone, so neither needs an install here.
      - name: Vulnerabilities in the preview refresher
        run: npm audit --prefix tools/tg-preview --audit-level=high
      - name: Vulnerabilities in the artwork tooling
        run: npm audit --prefix tools/artwork --audit-level=high

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # Pinned to a commit rather than the `v2` tag: this action runs with
      # secrets-adjacent trust (it reads full history looking for leaked
      # credentials) and a mutable tag can be repointed. `actions/*` stay on
      # their major tags below and elsewhere in this file - GitHub's own
      # actions, not pinned as a deliberate line.
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Production's migrations, before `deploy` builds anything. A job of its
  # own because `SUPABASE_DB_URL_PROD` lives in the Environment `production`
  # (deployment branch `main` only, no reviewers), and `deploy` already holds
  # `github-pages` - a job has one environment (docs/DECISIONS.md,
  # 2026-09-25, "The production connection string lives in an Environment
  # limited to `main`"). The same `needs` and `if:` as `deploy`, so a run
  # that does not deploy never asks for the environment.
  #
  # A deploy that carried a migration is undone for the app as any other
  # deploy (the "HOW TO UNDO" note below), never by deleting the migration:
  # this job has applied it, and `db push` refuses a remote history that
  # holds a version absent locally, so a deleted migration file would block
  # every later deploy. Revert the app change only, or add a new migration
  # whose body is the reversal file (`supabase/reversals/<name>`); restoring
  # data is `.claude/README.md`, "Backups and restore".
  migrate-prod:
    needs: [check, audit, secrets, browser, db, e2e]
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') && github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.skip_e2e) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    environment: production
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      # The pinned CLI and the `postgres` client; nothing here drives a browser.
      - run: npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'

      # A `skip_e2e` dispatch skipped `migrate-test`, so nothing proved the
      # branch's migrations on the test project: it may ship none that
      # production has not received already. This job holds the one
      # production credential in CI besides `backup.yml`'s.
      - name: A skip_e2e dispatch ships no migration production has not received
        if: inputs.skip_e2e
        run: node tools/supabase/pending-check.mjs
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL_PROD }}

      # Before `deploy`'s build, so a failed push stops the publish before it
      # starts.
      - name: 'migrate-prod: apply pending migrations to production'
        run: node node_modules/supabase/dist/supabase.js db push --db-url "$SUPABASE_DB_URL" --yes
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL_PROD }}

  # ---------------------------------------------------------------------------
  # Publishing, gated on check, audit, secrets, browser (the sharded suite
  # that carries the structural goldens, among everything else run-all.js
  # knows about), db, e2e and migrate-prod.
  #
  # What is published is the BUILT REWRITE: dist/index.html, dist/assets/ and
  # dist/data.js, assembled here with the generated data, the stub pages and the
  # artwork that live in the repository.
  #
  # HOW TO UNDO A BAD DEPLOY OF THE REWRITE
  #
  #     git revert <the commit that broke it>   # then push
  #
  # The next run of this job republishes whatever the tree looks like after the
  # revert, so reverting the offending commit is the whole procedure. What this
  # omits is the cost: push-to-live is ~7-8 minutes end to end (the `browser`
  # matrix dominates it - measured 7m21s on run 35241351714, 2026-09-17, on
  # top of the sharding described above), of which this `deploy` job's own
  # steps are ~30-40 seconds (37s that run). A cheaper path exists when the
  # *previous* commit was known good and nothing about the source needs to change:
  #
  #     gh run rerun <that earlier green run's id> --job <its deploy job id>
  #
  # re-runs only the `deploy` job from that old run - verified on that same
  # run (35241351714): 31s, no wait on `check`/`browser`/`audit`/`secrets`.
  # This is a rollback, never a retry: it republishes exactly the tree that
  # old run built, silently, with no new commit and no record in `git log` of
  # what is now live - reach for it only to undo a bad publish fast while a
  # proper revert is prepared, and never to "retry" a deploy that failed on
  # the *current* commit, since it would just republish stale content
  # instead.
  #
  # A deploy that carried a migration: see the `migrate-prod` job above.
  #
  # THE OLD APP IS GONE FROM THE REPOSITORY, NOT JUST FROM THE PUBLISHED SET
  #
  # index.html, app.js and style.css were deleted at R0c (issue 47, `23c00a6`)
  # once the rewrite had full parity - they are not a fallback sitting in the
  # tree, and there is no single command that brings them back as the served
  # site. They exist only in history:
  #
  #     git show 23c00a6^ -- index.html app.js style.css
  #
  # reads their content at the last commit before the deletion; restoring them
  # as the live site means reversing back through the cut-over as a deliberate
  # batch (re-adding the files, re-pointing this workflow's collect step,
  # reviving the suites that tested them), not a single revert.
  #
  # Pages is already set to "GitHub Actions" (build_type: workflow), so this
  # job is what publishes - nothing else does.
  # ---------------------------------------------------------------------------
  deploy:
    needs: [check, audit, secrets, browser, db, e2e, migrate-prod]
    # A skipped `e2e` passes and a failed one blocks. A push to main deploys;
    # so does the owner's dispatch on main with `skip_e2e`, the escape hatch
    # for a test project that is down (.claude/README.md, "Supabase
    # configuration"); no other dispatch deploys.
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') && github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.skip_e2e) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # A job-level `permissions:` block replaces the workflow-level one above
    # entirely rather than adding to it - without `contents: read` here this
    # job's token actually has `contents: none`, and `actions/checkout`
    # only ever worked because the repository is public.
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      # The published bytes are built here rather than handed over from the
      # check job, so this job reads on its own. The build is deterministic
      # from the commit, and deploy already needs the jobs that proved it -
      # so reverting the offending commit (see the revert note above) is
      # still the whole recovery procedure, not a multi-file patch.
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # The one configured build: sign-in is on only where both values are
      # set. Actions variables, not secrets - the publishable key ships in
      # every page; row level security is what guards the data.
      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}

      # `check:built` measures the unconfigured build; this is the bundle that
      # ships, with the account client's chunk in it.
      - name: Bundle size budget (the shipped, configured build)
        run: npm run budget

      # An explicit list rather than "everything": the repository also holds the
      # sources and the specs, and none of that belongs on a public site. A new
      # top-level asset has to be added here on purpose.
      #
      # Note `dist/assets` and `dist/data.js` by name, and never `cp -r dist/.`:
      # the build makes dist/img, dist/og and dist/card as symlinks into the
      # repository root (vite.config.mts, the artwork() plugin), and a symlink is
      # not what should reach the artifact. Those three folders are copied from
      # the repository below, like the rest of the static assets.
      # `dist/manifest.webmanifest`, `dist/sw.js` and `dist/icons` are build
      # outputs too, copied verbatim from app/public/ (docs/specs/META.md
      # section 9).
      #
      # `i/` (with `i/en/`) and `en/` are not in the repository - the Build step
      # above regenerates it (npm run build -> npm run data ->
      # tools/build-share-pages.js) immediately before this step copies it, so
      # Collect must never be reordered ahead of Build.
      - name: Collect what the site is made of
        run: |
          mkdir -p _site
          cp -r dist/index.html dist/assets dist/data.js dist/manifest.webmanifest \
                dist/sw.js dist/icons _site/
          cp -r data.json catalog.csv llms.txt robots.txt .nojekyll LICENSE \
                404.html img og i en card _site/
          # Only the generated site pages, one copy per language: pages/src/
          # is their authored source, not site content (docs/specs/META.md
          # section 9).
          mkdir -p _site/pages && cp pages/*.html _site/pages/
          mkdir -p _site/pages/en && cp pages/en/*.html _site/pages/en/

      - name: Nothing private slipped in, and nothing public left out
        run: |
          # app.js and style.css do not exist in the repository any more (the
          # old app was deleted at R0c, issue 47, 23c00a6) - if either turns up
          # in _site anyway, some other step re-created it, and a stray root
          # file like that must never reach _site.
          for f in package.json node_modules app tests tools docs .git app.js style.css \
                   pages/src supabase; do
            if [ -e "_site/$f" ]; then echo "::error::$f must not be published"; exit 1; fi
          done
          # The other half, and the deterministic detector for a dangling
          # symlink: [ -e ] is false for one, and [ -s ] / a non-empty listing
          # catches a link that resolved to nothing.
          for f in index.html data.js data.json catalog.csv \
                   llms.txt robots.txt LICENSE 404.html manifest.webmanifest \
                   sw.js icons/icon-192.png pages/install.html pages/en/install.html \
                   pages/privacy.html pages/en/privacy.html pages/terms.html \
                   pages/en/terms.html; do
            if [ ! -s "_site/$f" ]; then echo "::error::$f is missing or empty"; exit 1; fi
          done
          # .nojekyll is empty by design - its presence here is the whole
          # signal that the collect step above copied it. It does not,
          # however, do anything on the actually published site: Pages is
          # set to build_type: workflow (see the deploy job's own comment
          # below), which never runs Jekyll regardless, and
          # actions/upload-pages-artifact@v4 tars _site/ with
          # `--exclude=".[^/]*"`, so a dotfile never reaches the artifact it
          # uploads in the first place (confirmed: the live URL 404s for
          # it). This check can only ever fail for a reason that does not
          # matter to what gets served; it would matter only if Pages were
          # ever switched back to the legacy branch-based build, where a
          # missing .nojekyll lets Jekyll eat any file starting with `_`.
          if [ ! -e "_site/.nojekyll" ]; then echo "::error::.nojekyll is missing"; exit 1; fi
          # assets/ holds hashed names only, so it is checked as a folder.
          for d in assets img og i i/en en card pages pages/en; do
            if [ ! -d "_site/$d" ] || [ -z "$(ls -A "_site/$d")" ]; then
              echo "::error::$d is missing or empty"; exit 1
            fi
          done
          # One named file per symlinked or generated folder, not just "the
          # directory is non-empty" - the same by-name checks tools/check-site.mjs
          # makes against the live URL, made here first against the local copy.
          for f in og/_share.jpg og/_share_en.jpg img/_none.webp img/thumb/_none.webp \
                   card/die-d12-bw.svg i/w1.html i/en/w1.html en/index.html \
                   icons/maskable-512.png; do
            if [ ! -s "_site/$f" ]; then echo "::error::$f is missing or empty"; exit 1; fi
          done
          # `i/` and `i/en/` are built output (npm run build -> npm run
          # data -> tools/build-share-pages.js), one stub per data row per
          # language - "the directory is non-empty" above would pass just as
          # happily for one stub as for all of them, so it cannot catch a
          # partial generation. catalog.csv has exactly one header row plus
          # one row per record (tests/derived.js proves catalog.csv's own row
          # count against data.js already), so it is the count already on
          # disk to compare against, with no extra source of truth to invent.
          # Only *.html counts: i/ also holds the en/ directory.
          csv_rows=$(($(wc -l < _site/catalog.csv) - 1))
          for d in i i/en; do
            stub_count=$(find "_site/$d" -maxdepth 1 -name '*.html' | wc -l)
            echo "$d stub count: $stub_count, catalog.csv data rows: $csv_rows"
            if [ "$stub_count" -ne "$csv_rows" ]; then
              echo "::error::_site/$d has $stub_count stub pages but catalog.csv has $csv_rows data rows - a partial generation would otherwise slip past the non-empty check above"
              exit 1
            fi
          done
          # The collect step above only copies - byte-for-byte, not "a file of
          # the same name showed up".
          if ! cmp -s dist/index.html _site/index.html; then
            echo "::error::_site/index.html does not match dist/index.html"; exit 1
          fi
          if ! diff -r dist/assets _site/assets; then
            echo "::error::_site/assets does not match dist/assets"; exit 1
          fi
          echo "published:"; ls -A _site

      # The same content assertions tools/check-site.mjs makes against the
      # live URL after the deploy, run here first against the local copy -
      # one array of checks (tools/check-site.lib.mjs) driving both a
      # filesystem reader here and a fetch reader below, rather than this
      # step's own hand-written greps drifting from that file's checks the
      # way they used to.
      - name: The published content is what tools/check-site.mjs expects
        run: node tools/check-site.mjs --dir _site

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - id: pages
        uses: actions/deploy-pages@v4

      # The first thing in this repository that reads the live URL. It cannot
      # un-publish anything and is not meant to: it is what turns the run red so
      # a person knows the revert above is needed. Runnable by hand against the
      # same URL.
      - name: The published site answers correctly
        run: node tools/check-site.mjs "${{ steps.pages.outputs.page_url }}"
