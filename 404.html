<title>Страница не найдена / Page not found — Daggerheart Loot</title>

<!--
  Authored and tracked at the repository root, not generated: it carries no
  data, and GitHub Pages serves /404.html verbatim (with a 404 status) for
  any request under this site that does not match a real path - a truncated
  share link (i/<id>.htm), a hand-typed id, a stub whose record a data
  change dropped (docs/specs/DEBT.md, owner-approved).

  The two links below are root-anchored (/daggerheart-loot/...), not
  relative: this page can be served while the browser still shows an
  arbitrary, possibly nested bad path (e.g. /daggerheart-loot/i/<id>.htm),
  and a relative "./" link would resolve against *that* path's directory,
  not against this file's own location - the opposite of every other page
  in this repository, where the page is actually loaded at its own path and
  a relative link is what keeps file:// working. This page is never opened
  over file:// (nothing links to it locally; it only exists as a Pages
  serving fallback), so that constraint does not apply here, and getting the
  reader back to a working address does.
-->
<style>
  body{background:#0e0c15;color:#ece8f6;font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
       margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
  .w{max-width:420px;text-align:center}
  h1{font-size:22px;margin:0 0 6px}
  p{color:#cfc8e0;margin:0 0 20px}
  hr{border:none;border-top:1px solid #2a2438;margin:24px 0}
  a{color:#d8ab5e}
</style>
</head>
<body>
  <div class="w" id="app-404">
    <h1>Страница не найдена</h1>
    <p>Такой ссылки больше нет - возможно, она устарела или введена неверно.
       Можно открыть <a href="/daggerheart-loot/#/roll/std">генератор</a>
       или <a href="/daggerheart-loot/#/search">поиск</a>.</p>
    <hr>
    <h1>Page not found</h1>
    <p>This link no longer exists - it may be outdated or mistyped.
       Try the <a href="/daggerheart-loot/#/roll/std">generator</a>
       or <a href="/daggerheart-loot/#/search">search</a>.</p>
  </div>
</body>
