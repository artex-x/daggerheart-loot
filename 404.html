<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- kept out of search results, same as every other page - docs/specs/META.md
     section 1 -->
<meta name="robots" content="noindex, nofollow">
<title>Страницы по этому адресу нет / No page at this address - Daggerheart Loot</title>
<link rel="icon" type="image/svg+xml" href="https://daggerheart-loot.pages.dev/icons/favicon.svg">
<!--
  Authored and tracked at the repository root, not generated: it carries no
  data. Both hosts serve /404.html (with a 404 status) for a path that does
  not exist - a truncated share link, a hand-typed id, a stub whose record a
  data change dropped, the old host's install guide (docs/specs/META.md
  section 7).

  The links below are absolute URLs of the site's host, not relative: this
  page can be served while the browser shows an arbitrary, possibly nested
  bad path, where a relative link resolves against that path's directory.
  The old host serves the same file, and its root only forwards, so the
  links name the site's host itself.
--><style>
  body{background:#0e0c15;color:#ece8f6;font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
       margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
  .w{max-width:420px;text-align:center}
  h1,h2{font-size:22px;margin:0 0 6px}
  p{color:#cfc8e0;margin:0 0 20px}
  hr{border:none;border-top:1px solid #2a2438;margin:24px 0}
  a{color:#d8ab5e}
  /* The action links are targets: 24 px, and 40 px up to 600 px, by a padded box with the
     growth given back (DESIGN.md, "The Phone-First Rule"). */
  p a{--tg:24px;display:inline-block;position:relative;min-width:var(--tg);
      padding-block:max(0px,calc((var(--tg) - 1lh) / 2));margin-block:min(0px,calc((1lh - var(--tg)) / 2))}
  @media (max-width:600px){p a{--tg:40px}}
</style>
</head>
<body>
  <div class="w" id="app-404">
    <!-- The app's own not-found page in both languages (`NoPage.svelte`): its heading,
         its cause and its two actions. One `h1`; the English half is its `h2`. -->
    <h1>Страницы по этому адресу нет</h1>
    <p>Ссылка могла устареть или быть набрана с ошибкой.</p>
    <p><a href="https://daggerheart-loot.pages.dev/roll/std">На главную</a>
       · <a href="https://daggerheart-loot.pages.dev/tables">Открыть таблицы</a></p>
    <hr>
    <div lang="en">
      <h2>No page at this address</h2>
      <p>The link may be old or mistyped.</p>
      <p><a href="https://daggerheart-loot.pages.dev/en/roll/std">Home</a>
         · <a href="https://daggerheart-loot.pages.dev/en/tables">Open the tables</a></p>
    </div>
  </div>
</body>
</html>
