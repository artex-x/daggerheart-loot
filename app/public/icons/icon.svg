  <g fill="none" stroke="#d8ab5e" stroke-width="44" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="176" cy="256" r="76"/>
    <path d="M252 256h170"/>
    <path d="M356 256v58"/>
    <path d="M412 256v78"/>
  </g>
</svg>
