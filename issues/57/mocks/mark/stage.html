<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <title>Mark candidates - render stage</title>
    <style>
      /* The faces of tools/artwork/fonts/ (batch 1): the share card and the
         header take Source Sans 3 from the same files the card renderer uses. */
      @font-face {
        font-family: 'Source Sans 3';
        font-weight: 400;
        src: url('../../../../tools/artwork/fonts/SourceSans3-Regular.ttf');
      }
      @font-face {
        font-family: 'Source Sans 3';
        font-weight: 600 700;
        src: url('../../../../tools/artwork/fonts/SourceSans3-Semibold.ttf');
      }
      html,
      body {
        margin: 0;
        background: #000;
        font-family: 'Source Sans 3', sans-serif;
      }
      svg,
      img {
        display: block;
      }
      /* The app icon: today's flat Vault Ink ground with the mark at 1:1. */
      .icon {
        position: relative;
        background: #0e0c15;
        overflow: hidden;
        flex: none;
      }
      .icon img {
        width: 100%;
        height: 100%;
      }
      /* The favicon: the same icon on a rounded tile (3 px at 16 px), so the
         gold keeps a dark ground on a light tab strip too. */
      .tile {
        border-radius: 18.75%;
      }
      .ios {
        border-radius: 22.37%;
      }
      .circle {
        border-radius: 50%;
      }
      .squircle {
        clip-path: url(#squircle);
      }
      .min {
        clip-path: circle(40% at 50% 50%);
      }
      .safe::after {
        content: '';
        position: absolute;
        inset: 10%;
        border-radius: 50%;
        border: 2px dashed rgb(255 255 255 / 70%);
      }
      .row {
        display: flex;
        align-items: center;
        gap: 24px;
        padding: 20px 24px;
      }
      .cap {
        font-size: 13px;
        color: #9b93b3;
        margin-top: 6px;
        text-align: center;
      }
      .cell {
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      /* Chrome's tab strip, dark and light themes (measured on Chrome 130). */
      .strip {
        display: flex;
        align-items: flex-end;
        gap: 16px;
        padding: 8px 12px 0;
        height: 46px;
        box-sizing: border-box;
      }
      .strip.dark {
        background: #202124;
      }
      .strip.light {
        background: #dee1e6;
      }
      .tab {
        display: flex;
        align-items: center;
        gap: 8px;
        width: 210px;
        height: 34px;
        padding: 0 12px;
        box-sizing: border-box;
        border-radius: 8px 8px 0 0;
        font:
          12px 'Segoe UI',
          system-ui,
          sans-serif;
        white-space: nowrap;
        overflow: hidden;
      }
      .dark .tab {
        background: #35363a;
        color: #e8eaed;
      }
      .light .tab {
        background: #fff;
        color: #1f1f1f;
      }
      .tab.back {
        background: transparent !important;
        width: 160px;
      }
      .dark .tab.back {
        color: #9aa0a6;
      }
      .light .tab.back {
        color: #5f6368;
      }
      .tiles {
        display: flex;
        align-items: center;
        gap: 18px;
        padding: 14px 12px;
      }
      .tiles.dark {
        background: #202124;
      }
      .tiles.light {
        background: #dee1e6;
      }
      /* The header of mock 2 (Shell.svelte .topbar and .brand). */
      .page {
        background: linear-gradient(180deg, #14111d 0, #0e0c15 520px);
        height: 100vh;
      }
      .topbar {
        background: rgb(14 12 21 / 86%);
        border-bottom: 1px solid #312a45;
      }
      .topbar-in {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 11px 0;
        width: min(1180px, 100% - 32px);
        margin-inline: auto;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        color: #ece8f6;
      }
      .brand img {
        width: 26px;
        height: 26px;
      }
      .brand-txt {
        display: flex;
        flex-direction: column;
        line-height: 1.1;
      }
      .brand-txt b {
        font-size: 16px;
        font-weight: 700;
        letter-spacing: 0.2px;
      }
      .brand-txt i {
        font-style: normal;
        font-size: 11.5px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: #8a83a3;
      }
      .right {
        display: flex;
        gap: 8px;
        align-items: center;
      }
      .seg {
        display: flex;
        padding: 3px;
        border: 1px solid #3f3758;
        border-radius: 999px;
        font-size: 14px;
        font-weight: 600;
        color: #9b93b3;
      }
      .seg span {
        padding: 6px 12px;
        border-radius: 999px;
      }
      .seg .on {
        background: #221d31;
        color: #ece8f6;
        box-shadow: inset 0 0 0 1px #8a83a3;
      }
      .btn {
        padding: 8px 14px;
        border: 1px solid #3f3758;
        border-radius: 999px;
        font-size: 15px;
        font-weight: 600;
        color: #ece8f6;
        background: linear-gradient(#221d31, #1a1626);
      }
      .lineup {
        display: grid;
        grid-template-columns: 56px repeat(6, 92px);
        background: #0e0c15;
      }
      .lineup > div {
        height: 64px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 13px;
        color: #9b93b3;
      }
      .lineup .lab {
        justify-content: flex-start;
        padding-left: 10px;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <svg width="0" height="0" style="position: absolute">
      <!-- A superellipse (n = 4), the launcher squircle, in bounding-box units. -->
      <clipPath id="squircle" clipPathUnits="objectBoundingBox"><path id="sq" /></clipPath>
    </svg>
    <div id="out"></div>
    <script src="candidates.js"></script>
    <script>
      const q = new URLSearchParams(location.search);
      const v = q.get('v');
      const lang = q.get('lang') === 'en' ? 'en' : 'ru';
      const m = MARKS.find((x) => x.id === q.get('c'));
      const out = document.getElementById('out');
      {
        const pts = [];
        for (let k = 0; k < 64; k++) {
          const a = (k / 64) * 2 * Math.PI;
          const c = Math.cos(a),
            s = Math.sin(a);
          const x = 0.5 + 0.5 * Math.sign(c) * Math.abs(c) ** 0.5;
          const y = 0.5 + 0.5 * Math.sign(s) * Math.abs(s) ** 0.5;
          pts.push(x.toFixed(4) + ' ' + y.toFixed(4));
        }
        document.getElementById('sq').setAttribute('d', 'M' + pts.join(' L') + ' Z');
      }
      const icon = (file, px, cls = '') =>
        `<div class="icon ${cls}" style="width:${px}px;height:${px}px"><img src="${file}" alt=""></div>`;
      const TITLE = { ru: 'Генератор лута', en: 'Loot Generator' };
      const tabStrip = (theme, file) => `<div class="strip ${theme}">
          <div class="tab">${icon(file, 16, 'tile')}<span>${TITLE.ru} - Daggerheart</span></div>
          <div class="tab back">${icon(file, 16, 'tile')}<span>${TITLE.en}</span></div>
        </div>`;
      const tiles = (theme, file) => `<div class="tiles ${theme}">
          ${[16, 32, 48].map((s) => `<div class="cell">${icon(file, s, 'tile')}</div>`).join('')}
        </div>`;

      if (v === 'lineup') {
        const cols = MARKS.map((x) => x.file);
        const row = (label, cell) =>
          `<div class="lab">${label}</div>` + cols.map((f) => `<div>${cell(f)}</div>`).join('');
        out.innerHTML = `<div class="lineup">
          ${row(
            '',
            (f) =>
              MARKS.find((x) => x.file === f)
                .name.slice(0, 2)
                .replace('.', '') + (MARKS.find((x) => x.file === f).rec ? ' (rec.)' : '')
          )}
          ${row('16 dark', (f) => `<div class="strip dark" style="height:auto;padding:12px 26px">${icon(f, 16, 'tile')}</div>`)}
          ${row('16 light', (f) => `<div class="strip light" style="height:auto;padding:12px 26px">${icon(f, 16, 'tile')}</div>`)}
          ${row('32 dark', (f) => `<div class="strip dark" style="height:auto;padding:8px 18px">${icon(f, 32, 'tile')}</div>`)}
          ${row('48 light', (f) => `<div class="strip light" style="height:auto;padding:4px 10px">${icon(f, 48, 'tile')}</div>`)}
          ${row('header', (f) => `<img src="${f}" width="26" height="26" alt="">`)}
        </div>`;
      } else if (v === 'fav') {
        out.innerHTML =
          tabStrip('dark', m.file) +
          tiles('dark', m.file) +
          tabStrip('light', m.file) +
          tiles('light', m.file);
      } else if (v === 'apps') {
        out.innerHTML = `<div class="row" style="background:#3a3a40">
          <div class="cell">${icon(m.file, 180, 'ios')}<div class="cap" style="color:#ddd">apple-touch 180</div></div>
          <div class="cell">${icon(m.file, 192)}<div class="cap" style="color:#ddd">icon-192</div></div>
        </div>`;
      } else if (v === 'big') {
        out.innerHTML = `<div class="row" style="background:#3a3a40">
          <div class="cell">${icon(m.file, 256)}<div class="cap" style="color:#ddd">icon-512 (any)</div></div>
          <div class="cell">${icon(m.file, 256, 'circle safe')}<div class="cap" style="color:#ddd">maskable, circle</div></div>
          <div class="cell">${icon(m.file, 256, 'squircle safe')}<div class="cap" style="color:#ddd">maskable, squircle</div></div>
          <div class="cell">${icon(m.file, 256, 'min safe')}<div class="cap" style="color:#ddd">maskable, minimum (r 40%)</div></div>
        </div>`;
      } else if (v === 'head') {
        const L = {
          ru: { word: 'Лут', seg: ['RU', 'EN'], btn: 'Войти' },
          en: { word: 'Loot', seg: ['RU', 'EN'], btn: 'Sign in' }
        }[lang];
        out.innerHTML = `<div class="page"><div class="topbar"><div class="topbar-in">
          <div class="brand"><img src="${m.file}" alt=""><span class="brand-txt"><b>${L.word}</b><i>Daggerheart</i></span></div>
          <div class="right"><div class="seg"><span class="${lang === 'ru' ? 'on' : ''}">RU</span><span class="${lang === 'en' ? 'on' : ''}">EN</span></div><div class="btn">${L.btn}</div></div>
        </div></div></div>`;
      } else if (v === 'share') {
        /* shareCardSvg() as mock 1 draws it (share.html, ?v=rec), with the mark
           in the star's place: an 84 px box centred on the star's centre. */
        const T = {
          ru: { title: 'Генератор лута', sub: 'Добыча, расходники, оружие и броня · RU / EN' },
          en: { title: 'Loot Generator', sub: 'Loot, consumables, weapons and armor · RU / EN' }
        }[lang];
        const font = `font-family="'Source Sans 3'"`;
        out.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
          <defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="520" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#14111d"/><stop offset="1" stop-color="#0e0c15"/></linearGradient></defs>
          <rect width="1200" height="630" fill="url(#g)"/>
          <image href="${m.file}" x="50" y="258" width="84" height="84"/>
          <text x="150" y="321" ${font} font-size="64" font-weight="600" fill="#ece8f6">${T.title}</text>
          <text x="152" y="368" ${font} font-size="30" font-weight="600" letter-spacing="2" fill="#8a83a3">DAGGERHEART</text>
          <text x="152" y="418" ${font} font-size="26" font-weight="400" fill="#9b93b3">${T.sub}</text>
        </svg>`;
      }
    </script>
  </body>
</html>
